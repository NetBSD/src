/*
 * Reference cycles in remote-servers lists are legal and resolve to
 * the addresses reachable without following the cycle (GL #6287).
 */

primaries "xfer-servers" { "xfer-servers"; };
primaries "loop-tail" { 10.53.0.99; "loop-tail"; };
primaries "loop-a" { "loop-b"; };
primaries "loop-b" { "loop-a"; 10.53.0.99; };

zone "example" {
	type primary;
	file "example.db";
	also-notify { "xfer-servers"; };
};

zone "cycle-tail" {
	type secondary;
	file "cycle-tail.db";
	primaries { "loop-tail"; };
};

zone "cycle-mutual" {
	type secondary;
	file "cycle-mutual.db";
	primaries { "loop-a"; };
};
